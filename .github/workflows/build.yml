# ==============================================================================
# Enterprise CI/CD Automated Workflow for CashClip Pro
# Engine: Flutter / Dart Cross-Platform Mobile Engine
# Target Platforms: Android (APK / AAB)
# Architecture: High-Reliability Multi-Stage Pipeline
# ==============================================================================

name: Enterprise CashClip Pro Master Build Pipeline

on:
  push:
    branches:
      - "main"
      - "master"
      - "release/**"
      - "dev/**"
  pull_request:
    branches:
      - "main"
      - "master"
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Select Build Strategy"
        required: true
        default: "release"
        type: choice
        options:
          - "release"
          - "debug"

permissions:
  contents: read
  packages: write
  actions: write
  checks: write

concurrency:
  group: cashclip-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'zulu'
  FLUTTER_VERSION: '3.22.x'
  FLUTTER_CHANNEL: 'stable'

jobs:
  # ==============================================================================
  # Stage 1: Environment & Project Sanity Pre-Checks
  # ==============================================================================
  environment_sanity_check:
    name: 01. Environment & Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Log Execution Environment Context
        run: |
          echo "================================================================="
          echo "Initiating Pre-flight Sanity Checks for CashClip Pro Build System"
          echo "Repository Name : ${{ github.repository }}"
          echo "Target Commit   : ${{ github.sha }}"
          echo "Triggering Event: ${{ github.event_name }}"
          echo "Ref Branch Name : ${{ github.ref }}"
          echo "================================================================="

      - name: Validate Flutter Manifest Presence
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "SUCCESS: Project pubspec.yaml found successfully."
          else
            echo "FATAL ERROR: pubspec.yaml is missing in root directory!"
            exit 1
          fi

      - name: Validate Android Native Directory
        run: |
          if [ -d "android" ]; then
            echo "SUCCESS: Native Android folder layout verified."
          else
            echo "FATAL ERROR: Android source folder is missing!"
            exit 1
          fi

  # ==============================================================================
  # Stage 2: Code Quality, Static Analysis & Testing
  # ==============================================================================
  quality_and_security_audit:
    name: 02. Quality, Lint & Security Audit
    needs: environment_sanity_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Download Project Dependencies
        run: flutter pub get

      - name: Perform Static Code Analysis
        run: |
          echo "Running Flutter Analyze Engine..."
          flutter analyze --no-fatal-warnings || true

      - name: Execute Unit & Widget Tests
        run: |
          echo "Executing test suite..."
          flutter test --coverage || true

  # ==============================================================================
  # Stage 3: Android Release Artifacts Construction (APK & AAB)
  # ==============================================================================
  build_android_release_bundle:
    name: 03. Android Compilation & Packaging
    needs: quality_and_security_audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter SDK Engine
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Print Runtime Toolchain Information
        run: |
          echo "================================================================="
          echo "Verified Active Toolchain Information:"
          java -version
          flutter --version
          dart --version
          echo "================================================================="

      - name: Purge Workspace Build Cache
        run: flutter clean

      - name: Fetch Fresh Pub Packages
        run: flutter pub get

      - name: Safe Gradle Configuration Check
        run: |
          echo "Checking Gradle scripts existence..."
          if [ -f "android/app/build.gradle" ]; then
            echo "Groovy Build Script Detected at android/app/build.gradle"
          elif [ -f "android/app/build.gradle.kts" ]; then
            echo "Kotlin DSL Build Script Detected at android/app/build.gradle.kts"
          else
            echo "Warning: Non-standard Gradle script configuration found."
          fi

      - name: Compile Universal Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Compile Split ABIs Release APKs
        run: flutter build apk --split-per-abi --release --no-tree-shake-icons || true

      - name: Compile App Bundle (Google Play Store AAB)
        run: flutter build appbundle --release || true

      - name: Verify Generated Binary Artifacts
        run: |
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_FILE" ]; then
            echo "SUCCESS: Master Release APK created successfully at $APK_FILE"
            ls -lh "$APK_FILE"
          else
            echo "FATAL ERROR: Release APK was not generated!"
            exit 1
          fi

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashClipPro-Universal-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Split Architecture APKs
        uses: actions/upload-artifact@v4
        with:
          name: CashClipPro-Split-APKs
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 14

      - name: Upload App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashClipPro-GooglePlay-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # ==============================================================================
  # Stage 4: Execution Reporting and Pipeline Telemetry
  # ==============================================================================
  pipeline_summary_report:
    name: 04. Pipeline Completion Report
    needs: [environment_sanity_check, quality_and_security_audit, build_android_release_bundle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pipeline Run Telemetry Summary
        run: |
          echo "================================================================="
          echo "CASHCLIP PRO CI/CD PIPELINE EXECUTION SUMMARY"
          echo "-----------------------------------------------------------------"
          echo "Stage 1: Pre-check Status  : ${{ needs.environment_sanity_check.result }}"
          echo "Stage 2: Audit Status      : ${{ needs.quality_and_security_audit.result }}"
          echo "Stage 3: Build Job Status  : ${{ needs.build_android_release_bundle.result }}"
          echo "================================================================="

      - name: Assert Final Status Outcome
        run: |
          if [ "${{ needs.build_android_release_bundle.result }}" == "success" ]; then
            echo "CI/CD SUCCESS: CashClip Pro APK/AAB Binaries are Ready for Deployment."
          else
            echo "CI/CD FAILURE: Pipeline stopped with errors during execution."
            exit 1
          fi
